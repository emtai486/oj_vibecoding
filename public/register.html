<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>用户注册</title>
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/layout.css">
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="/">CodeJudge</a>
    </header>

    <main class="form-page">
      <form id="register-form" class="form-panel">
        <span class="eyebrow">Create Account</span>
        <h1>用户注册</h1>
        <p class="form-hint">普通用户可浏览题目、提交代码并记录本地通过状态。</p>
        <label>
          用户名
          <input name="username" autocomplete="username" required>
        </label>
        <label>
          密码
          <input name="password" type="password" autocomplete="new-password" required>
        </label>
        <button type="submit">注册账号</button>
        <p id="register-message" class="muted"></p>
        <div class="auth-links">
          <a href="/login.html">已有账号登录</a>
          <a href="/">返回首页</a>
        </div>
      </form>
    </main>

    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
  </body>
</html>
