<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>OJ 题目详情</title>
    <link rel="stylesheet" href="/vendor/codemirror/codemirror.css">
    <link rel="stylesheet" href="/vendor/codemirror/theme/material-darker.css">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/layout.css">
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="/">CodeJudge</a>
      <nav class="nav" id="auth-nav">
        <a href="/login.html">登录</a>
        <a href="/register.html">注册</a>
        <a href="/admin/login.html">管理后台</a>
      </nav>
    </header>

    <main class="workspace">
      <section class="problem-pane">
        <header class="problem-header">
          <span class="eyebrow">Problem Brief</span>
          <h1 id="problem-title">题目</h1>
          <div id="problem-meta" class="problem-meta muted"></div>
        </header>
        <article id="problem-content" class="statement"></article>
      </section>

      <section class="editor-pane">
        <div class="editor-toolbar">
          <div class="editor-title">
            <span class="pill">C++17</span>
            <h2>代码编辑器</h2>
          </div>
          <span class="pill">CodeMirror Local</span>
        </div>

        <div class="editor-frame">
          <textarea id="code-editor"></textarea>
        </div>

        <div class="submit-dock">
          <div class="actions">
            <button id="submit-code" type="button">提交代码</button>
          </div>
          <span id="submit-result" class="muted">等待提交</span>
        </div>
      </section>
    </main>

    <script src="/vendor/codemirror/codemirror.js"></script>
    <script src="/vendor/codemirror/mode/clike/clike.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/storage.js"></script>
    <script src="/js/editor.js"></script>
    <script src="/js/problem-detail.js"></script>
  </body>
</html>
