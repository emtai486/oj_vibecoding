<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>题目列表</title>
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/layout.css">
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="/">CodeJudge</a>
      <nav class="nav" id="auth-nav">
        <a href="/login.html">登录</a>
        <a href="/register.html">注册</a>
        <a href="/admin/login.html">管理后台</a>
      </nav>
    </header>

    <main class="page problem-list-page">
      <section class="section-heading">
        <div>
          <span class="eyebrow">Problem Set</span>
          <h1>题目列表</h1>
          <p>选择题目进入编辑器，提交 C++ 代码后会在当前浏览器记录通过状态。</p>
        </div>
        <a class="button-link button-secondary" href="/">返回首页</a>
      </section>

      <section class="panel" aria-label="题目列表">
        <div class="panel-header">
          <div class="panel-title">
            <span class="eyebrow">Training Workspace</span>
            <h2>全部题目</h2>
          </div>
          <span id="problem-count" class="pill">0 题</span>
        </div>
        <div class="table-scroll">
          <table class="problem-table">
            <thead>
              <tr>
                <th>ID</th>
                <th>标题</th>
                <th>难度</th>
                <th>状态</th>
              </tr>
            </thead>
            <tbody id="problem-list">
              <tr>
                <td colspan="4" class="muted">正在加载</td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>
    </main>

    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/storage.js"></script>
    <script src="/js/problem-list.js"></script>
  </body>
</html>
