<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>用户登录</title>
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/layout.css">
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="/">CodeJudge</a>
    </header>

    <main class="form-page">
      <form id="login-form" class="form-panel">
        <span class="eyebrow">User Session</span>
        <h1>用户登录</h1>
        <p class="form-hint">普通用户登录后可进入题库并提交 C++ 代码；管理员请使用管理员入口。</p>
        <label>
          用户名
          <input name="username" autocomplete="username" required>
        </label>
        <label>
          密码
          <input name="password" type="password" autocomplete="current-password" required>
        </label>
        <button type="submit">进入题库</button>
        <p id="login-message" class="muted"></p>
        <div class="auth-links">
          <a href="/register.html">创建普通用户</a>
          <a href="/admin/login.html">管理员登录</a>
        </div>
      </form>
    </main>

    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
  </body>
</html>
