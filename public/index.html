<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>OJ 题目列表</title>
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/layout.css">
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="/">OJ</a>
      <nav class="nav">
        <a href="/login.html">登录</a>
        <a href="/register.html">注册</a>
        <a href="/admin/login.html">管理后台</a>
      </nav>
    </header>

    <main class="page">
      <section class="panel">
        <div class="panel-header">
          <h1>题目</h1>
          <span id="problem-count" class="muted">0 题</span>
        </div>
        <table class="problem-table">
          <thead>
            <tr>
              <th>ID</th>
              <th>标题</th>
              <th>难度</th>
              <th>状态</th>
            </tr>
          </thead>
          <tbody id="problem-list">
            <tr>
              <td colspan="4" class="muted">正在加载</td>
            </tr>
          </tbody>
        </table>
      </section>
    </main>

    <script src="/js/api.js"></script>
    <script src="/js/storage.js"></script>
    <script src="/js/problem-list.js"></script>
  </body>
</html>
